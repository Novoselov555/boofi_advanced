version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:

      SPRING_JPA_HIBERNATE_DDL_AUTO: update


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:8080
    ports:
      - "5173:80"
    depends_on:
      - backend
